name: Full KO conversion progress

on:
  push:
    branches:
      - phase-0-ko-mobile-baseline
  pull_request:

permissions:
  contents: read

jobs:
  convert-non3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MMORPG
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install conversion dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch exact KO sources
        run: python tools/setup_ko_sources.py

      - name: Inventory complete source tree
        run: |
          mkdir -p artifacts
          python tools/full_game_inventory.py \
            --source unity/LegacySource/ko-assets-1298 \
            --output artifacts/ko-1298-full-inventory.json

      - name: Inspect legacy texture header variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path('unity/LegacySource/ko-assets-1298')
          names = {
              'itemicon_3_2041_01_1.dxt',
              'itemicon_3_2041_01_2.dxt',
              'itemicon_3_2041_01_3.dxt',
              'itemicon_3_3031_01_4.dxt',
          }
          found = []
          for path in root.rglob('*.dxt'):
              if path.name.lower() not in names:
                  continue
              data = path.read_bytes()
              first = data[:64]
              ints = [struct.unpack_from('<I', first, offset)[0] for offset in range(0, min(48, len(first) - 3), 4)]
              print('TEXTURE_HEADER', path.relative_to(root).as_posix())
              print('SIZE', len(data))
              print('HEX64', first.hex())
              print('U32', ints)
              found.append(path.name.lower())
          missing = sorted(names - set(found))
          print('FOUND', len(found), 'MISSING', missing)
          if missing:
              raise SystemExit(2)
          PY

      - name: Convert all deterministic non-3D assets
        run: |
          python tools/convert_non3d_assets.py \
            --source unity/LegacySource/ko-assets-1298 \
            --inventory artifacts/ko-1298-full-inventory.json \
            --unity-assets unity/Assets \
            --vendor-root tools/vendor \
            --manifest artifacts/ko-1298-conversion-manifest.json

      - name: Convert original CharacterCreate UIF
        run: |
          mkdir -p unity/Assets/Resources/LegacyUI
          python tools/convert_uif.py \
            --source-root unity/LegacySource/ko-assets-1298 \
            --discover-character-create \
            --output unity/Assets/Resources/LegacyUI/character_create.json

      - name: Show strict final gate status
        continue-on-error: true
        run: |
          python tools/full_game_gate.py \
            --inventory artifacts/ko-1298-full-inventory.json \
            --conversion artifacts/ko-1298-conversion-manifest.json

      - name: Upload conversion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-1298-conversion-progress
          path: |
            artifacts/ko-1298-full-inventory.json
            artifacts/ko-1298-conversion-manifest.json
            unity/Assets/Resources/LegacyUI/character_create.json
          if-no-files-found: error
