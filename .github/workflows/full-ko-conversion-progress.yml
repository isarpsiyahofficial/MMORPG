name: Full KO conversion progress

on:
  push:
    branches:
      - phase-0-ko-mobile-baseline
  pull_request:

permissions:
  contents: read

jobs:
  convert-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MMORPG
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install conversion dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch exact KO sources
        run: python tools/setup_ko_sources.py

      - name: Inventory complete source tree
        run: |
          mkdir -p artifacts
          python tools/full_game_inventory.py \
            --source unity/LegacySource/ko-assets-1298 \
            --output artifacts/ko-1298-full-inventory.json \
            --fail-on-unclassified

      - name: Convert deterministic Android assets
        run: |
          python tools/convert_non3d_assets.py \
            --source unity/LegacySource/ko-assets-1298 \
            --inventory artifacts/ko-1298-full-inventory.json \
            --unity-assets unity/Assets \
            --vendor-root tools/vendor \
            --manifest artifacts/ko-1298-conversion-manifest.json

      - name: Build byte-exact Android KO runtime pack
        run: |
          python tools/build_android_runtime_pack.py \
            --source unity/LegacySource/ko-assets-1298 \
            --inventory artifacts/ko-1298-full-inventory.json \
            --unity-assets unity/Assets \
            --output-manifest artifacts/ko-1298-runtime-pack.json

      - name: Validate supported N3 formats across complete source tree
        run: |
          python tools/validate_n3_runtime.py \
            --source unity/LegacySource/ko-assets-1298 \
            --vendor-root tools/vendor \
            --output artifacts/ko-1298-n3-validation.json

      - name: Convert every original KO UIF
        run: |
          mkdir -p unity/Assets/StreamingAssets/KOConverted/UI
          python tools/convert_uif.py \
            --source-root unity/LegacySource/ko-assets-1298 \
            --all \
            --output-root unity/Assets/StreamingAssets/KOConverted/UI \
            --manifest artifacts/ko-1298-uif-validation.json

      - name: Convert original CharacterCreate UIF for bootstrap Resources
        run: |
          mkdir -p unity/Assets/Resources/LegacyUI
          python tools/convert_uif.py \
            --source-root unity/LegacySource/ko-assets-1298 \
            --discover-character-create \
            --output unity/Assets/Resources/LegacyUI/character_create.json

      - name: Strict whole-game conversion gate
        run: |
          python tools/full_game_gate.py \
            --inventory artifacts/ko-1298-full-inventory.json \
            --conversion artifacts/ko-1298-conversion-manifest.json

      - name: Upload conversion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-1298-conversion-progress
          path: |
            artifacts/ko-1298-full-inventory.json
            artifacts/ko-1298-conversion-manifest.json
            artifacts/ko-1298-runtime-pack.json
            artifacts/ko-1298-n3-validation.json
            artifacts/ko-1298-uif-validation.json
            unity/Assets/Resources/LegacyUI/character_create.json
            unity/Assets/StreamingAssets/KOConverted/texture-index.json
          if-no-files-found: warn
