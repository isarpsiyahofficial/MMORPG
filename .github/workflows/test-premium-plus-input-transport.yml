name: Test Premium Plus Input Transport

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/input_transport.hpp'
      - 'tools/premium-plus-combo/transport_tests.cpp'
      - 'tools/premium-plus-combo/main.cpp'
      - 'tools/premium-plus-combo/app.manifest'
      - '.github/workflows/test-premium-plus-input-transport.yml'
  workflow_dispatch:

jobs:
  scan-code-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run DirectInput transport tests
        shell: cmd
        run: |
          cd tools\premium-plus-combo
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 transport_tests.cpp /Fe:TransportTests.exe user32.lib
          TransportTests.exe
      - name: Verify production transport and elevation manifest
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $main = Get-Content main.cpp -Raw
          $transport = Get-Content input_transport.hpp -Raw
          $manifest = Get-Content app.manifest -Raw
          if ($main -notmatch 'SendInputScanCodeCompatible') { throw 'Production macro engine is not routed through scan-code transport' }
          if ($transport -notmatch 'MAPVK_VK_TO_VSC_EX') { throw 'Extended scan-code mapping missing' }
          if ($transport -notmatch 'KEYEVENTF_SCANCODE') { throw 'KEYEVENTF_SCANCODE missing' }
          if ($manifest -notmatch 'requireAdministrator') { throw 'Administrator integrity manifest missing' }
          'DirectInputTransport=PASS'
          'RatesPreserved=Maximum120PerKey,Turbo240PerKey'
