name: Test Premium Plus Game Visible Input

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-game-visible-input.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-game-visible-input.yml'
  workflow_dispatch:

concurrency:
  group: premium-plus-game-visible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-input-state:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact portable EXE
        shell: cmd
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Sample 8 9 0 R as game-style keyboard state
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class PpcInputProbe {
            [DllImport("user32.dll")] public static extern short GetAsyncKeyState(int vKey);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h, string n);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            public delegate bool EnumProc(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            public static IntPtr Find(uint pid) {
              IntPtr result = IntPtr.Zero;
              EnumWindows(delegate(IntPtr h, IntPtr l) {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && GetDlgItem(h, 1001) != IntPtr.Zero && GetDlgItem(h, 1401) != IntPtr.Zero) { result=h; return false; }
                return true;
              }, IntPtr.Zero);
              return result;
            }
          }
          "@
          function Prop([IntPtr]$h,[string]$n) { return [PpcInputProbe]::GetProp($h,$n).ToInt64() }
          function Click([IntPtr]$h,[int]$x,[int]$y) { $lp=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcInputProbe]::SendMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$lp) }
          function Sample([int]$intervalMs,[int]$durationMs) {
            $keys=@(0x38,0x39,0x30,0x52)
            $prev=@($false,$false,$false,$false)
            $count=@(0,0,0,0)
            $sw=[Diagnostics.Stopwatch]::StartNew()
            while($sw.ElapsedMilliseconds -lt $durationMs) {
              for($i=0;$i-lt 4;$i++) {
                $down=(([PpcInputProbe]::GetAsyncKeyState($keys[$i]) -band 0x8000) -ne 0)
                if($down -and -not $prev[$i]) { $count[$i]++ }
                $prev[$i]=$down
              }
              Start-Sleep -Milliseconds $intervalMs
            }
            return $count
          }

          $p=Start-Process -FilePath (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
          $h=[IntPtr]::Zero
          for($i=0;$i-lt 80;$i++) { Start-Sleep -Milliseconds 100; $h=[PpcInputProbe]::Find([uint32]$p.Id); if($h-ne[IntPtr]::Zero){break} }
          if($h-eq[IntPtr]::Zero){throw 'Main window missing'}
          Start-Sleep -Milliseconds 300

          # Maximum: 12 ms down-state is intentionally visible to an approximately 90 Hz sampler.
          Click $h 307 118
          Start-Sleep -Milliseconds 100
          $max=Sample 11 1800
          Click $h 492 118
          Start-Sleep -Milliseconds 150
          if((Prop $h 'PPC_ACTIVE')-ne 0){throw 'Stop failed'}
          if($max[0]-lt 4 -or $max[1]-lt 4 -or $max[2]-lt 4 -or $max[3]-lt 2) { throw "Maximum state visibility failed: 8=$($max[0]) 9=$($max[1]) 0=$($max[2]) R=$($max[3])" }

          # Turbo: select mode, then sample at roughly 144 Hz.
          Click $h 502 209
          Click $h 307 118
          Start-Sleep -Milliseconds 100
          $turbo=Sample 7 1600
          Click $h 492 118
          Start-Sleep -Milliseconds 150
          if($turbo[0]-lt 4 -or $turbo[1]-lt 4 -or $turbo[2]-lt 4 -or $turbo[3]-lt 2) { throw "Turbo state visibility failed: 8=$($turbo[0]) 9=$($turbo[1]) 0=$($turbo[2]) R=$($turbo[3])" }

          "MaximumSampler90Hz: 8=$($max[0]) 9=$($max[1]) 0=$($max[2]) R=$($max[3])" | Set-Content game-visible-input.txt
          "TurboSampler144Hz: 8=$($turbo[0]) 9=$($turbo[1]) 0=$($turbo[2]) R=$($turbo[3])" | Add-Content game-visible-input.txt
          "GameVisibleInputSampler=PASS" | Add-Content game-visible-input.txt
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PremiumPlusCombo-GameVisibleInput
          path: |
            tools/premium-plus-combo/game-visible-input.txt
            tools/premium-plus-combo/PremiumPlusCombo.exe
          if-no-files-found: warn
