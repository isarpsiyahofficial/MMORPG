name: Verify Premium Plus Known Good Recovery

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-known-good-recovery.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-known-good-recovery.yml'
  workflow_dispatch:

jobs:
  verify-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prove user verified source was preserved
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin 4d68f5e2cc595c979cbbf657a3fc1e55a073ac3d --depth=1
          $changed = @(git diff --name-only 4d68f5e2cc595c979cbbf657a3fc1e55a073ac3d -- tools/premium-plus-combo)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'tools/premium-plus-combo/main.cpp') {
            throw "Known-good application drift detected: $($changed -join ', ')"
          }
          $diff = git diff --unified=0 4d68f5e2cc595c979cbbf657a3fc1e55a073ac3d -- tools/premium-plus-combo/main.cpp | Out-String
          if ($diff -notmatch 'PpcKnownGoodGameSendInput' -or $diff -notmatch 'g_ppcGameTapLock') {
            throw 'Isolated repaired game-input wrapper missing'
          }
          'KnownGoodApplicationSource=PASS' | Set-Content recovery-report.txt
          'OnlyApplicationSourceDifference=main.cpp' | Add-Content recovery-report.txt

      - name: Compile core tests and release EXE
        run: |
          cd tools\premium-plus-combo
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 tests.cpp /Fe:PremiumPlusTests.exe
          PremiumPlusTests.exe
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 transport_tests.cpp /Fe:TransportTests.exe user32.lib
          TransportTests.exe
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Build injected game-key observer
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          @'
          #define NOMINMAX
          #include <windows.h>
          #include <cstdio>
          #include <atomic>
          std::atomic<unsigned long long> c8{0},c9{0},c0{0},cR{0},cF2{0},c6{0},cF1{0},overlap{0};
          int trackedDown=0;
          bool tracked(DWORD vk){return vk=='8'||vk=='9'||vk=='0'||vk=='R'||vk==VK_F1||vk==VK_F2||vk=='6';}
          LRESULT CALLBACK Hook(int code,WPARAM wp,LPARAM lp){
            if(code==HC_ACTION && lp){
              const auto* k=reinterpret_cast<const KBDLLHOOKSTRUCT*>(lp);
              if((k->flags&LLKHF_INJECTED)!=0 && tracked(k->vkCode)){
                const bool down=wp==WM_KEYDOWN||wp==WM_SYSKEYDOWN;
                const bool up=wp==WM_KEYUP||wp==WM_SYSKEYUP;
                if(down){
                  if(trackedDown>0) ++overlap;
                  ++trackedDown;
                  if(k->vkCode=='8')++c8; else if(k->vkCode=='9')++c9; else if(k->vkCode=='0')++c0;
                  else if(k->vkCode=='R')++cR; else if(k->vkCode==VK_F2)++cF2; else if(k->vkCode=='6')++c6; else if(k->vkCode==VK_F1)++cF1;
                } else if(up && trackedDown>0) --trackedDown;
              }
            }
            return CallNextHookEx(nullptr,code,wp,lp);
          }
          int WINAPI wWinMain(HINSTANCE h,HINSTANCE,PWSTR,int){
            HHOOK hook=SetWindowsHookExW(WH_KEYBOARD_LL,Hook,h,0); if(!hook)return 2;
            const ULONGLONG end=GetTickCount64()+8000; MSG msg{};
            while(GetTickCount64()<end){while(PeekMessageW(&msg,nullptr,0,0,PM_REMOVE)){TranslateMessage(&msg);DispatchMessageW(&msg);}Sleep(1);}
            UnhookWindowsHookEx(hook);
            FILE* f=nullptr;_wfopen_s(&f,L"game-keys-observed.txt",L"w, ccs=UTF-8");if(!f)return 3;
            fwprintf(f,L"8=%llu\n9=%llu\n0=%llu\nR=%llu\nF2=%llu\n6=%llu\nF1=%llu\nOverlap=%llu\n",c8.load(),c9.load(),c0.load(),cR.load(),cF2.load(),c6.load(),cF1.load(),overlap.load());
            fclose(f);return 0;
          }
          '@ | Set-Content -Encoding utf8 game_key_observer.cpp
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE game_key_observer.cpp /Fe:GameKeyObserver.exe /link /SUBSYSTEM:WINDOWS user32.lib

      - name: Verify Turkish UI and repaired 8 9 0 R Cure delivery
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $ErrorActionPreference='Stop'
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;using System.Text;using System.Runtime.InteropServices;
          public static class W{
            public delegate bool EP(IntPtr h,IntPtr p);
            [DllImport("user32.dll")]public static extern bool EnumWindows(EP p,IntPtr l);
            [DllImport("user32.dll")]public static extern uint GetWindowThreadProcessId(IntPtr h,out uint p);
            [DllImport("user32.dll")]public static extern IntPtr GetDlgItem(IntPtr h,int id);
            [DllImport("user32.dll",CharSet=CharSet.Unicode,EntryPoint="SendMessageW")]public static extern IntPtr GetText(IntPtr h,uint m,IntPtr w,StringBuilder b);
            [DllImport("user32.dll")]public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern IntPtr GetProp(IntPtr h,string n);
            [DllImport("user32.dll")]public static extern void keybd_event(byte v,byte s,uint f,UIntPtr x);
            [DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);
            public static IntPtr Main(uint pid){IntPtr r=IntPtr.Zero;EnumWindows(delegate(IntPtr h,IntPtr l){uint p;GetWindowThreadProcessId(h,out p);if(p==pid&&GetDlgItem(h,1001)!=IntPtr.Zero){r=h;return false;}return true;},IntPtr.Zero);return r;}
          }
          "@
          function C([IntPtr]$w,[int]$id){[W]::GetDlgItem($w,$id)}
          function T([IntPtr]$h){$b=New-Object Text.StringBuilder 256;[void][W]::GetText($h,0x000D,[IntPtr]$b.Capacity,$b);$b.ToString()}
          function P([IntPtr]$w,[string]$n){[W]::GetProp($w,$n).ToInt64()}
          function Click([IntPtr]$w,[int]$x,[int]$y){$lp=(($y-band65535)-shl16)-bor($x-band65535);[void][W]::SendMessage($w,0x0202,[IntPtr]::Zero,[IntPtr]$lp);Start-Sleep -Milliseconds 160}
          function Key([byte]$v){[W]::keybd_event($v,0,0,[UIntPtr]::Zero);Start-Sleep -Milliseconds 80;[W]::keybd_event($v,0,2,[UIntPtr]::Zero);Start-Sleep -Milliseconds 160}
          function Shot([IntPtr]$w){$b=New-Object Drawing.Bitmap 800,500;$g=[Drawing.Graphics]::FromImage($b);$dc=$g.GetHdc();$ok=[W]::PrintWindow($w,$dc,0);$g.ReleaseHdc($dc);$g.Dispose();if(-not$ok){throw'PrintWindow failed'};$b.Save((Join-Path (Get-Location)'known-good-ui.png'),[Drawing.Imaging.ImageFormat]::Png);$b.Dispose()}

          $observer=Start-Process (Resolve-Path .\GameKeyObserver.exe) -PassThru
          Start-Sleep -Milliseconds 300
          $app=Start-Process (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
          $w=[IntPtr]::Zero
          for($i=0;$i-lt80;$i++){Start-Sleep -Milliseconds 100;$app.Refresh();if($app.HasExited){throw"app exited $($app.ExitCode)"};$w=[W]::Main([uint32]$app.Id);if($w-ne[IntPtr]::Zero){break}}
          if($w-eq[IntPtr]::Zero){throw'main window missing'}
          Start-Sleep -Milliseconds 450
          if((P $w 'PPC_ACTIVE')-ne0){throw'app auto-started'}
          if((T(C $w 1901))-ne'Başlat|Giriş Dizisi|Ayarlarımı Kaydet|Çalışıyor'){throw'Turkish UI changed or mojibake returned'}
          if((T(C $w 1001))-ne'8'-or(T(C $w 1002))-ne'9'-or(T(C $w 1003))-ne'0'){throw'default combo changed'}
          if((T(C $w 1301))-ne'CAPS LOCK'-or(T(C $w 1302))-ne'CAPS LOCK'){throw'known-good hotkeys changed'}
          Shot $w

          Click $w 307 118
          Start-Sleep -Milliseconds 1300
          Key 0x43
          Start-Sleep -Milliseconds 2600
          Click $w 492 118
          if((P $w 'PPC_ACTIVE')-ne0){throw'stop failed'}
          Stop-Process -Id $app.Id -Force
          $observer.WaitForExit()
          if($observer.ExitCode-ne0){throw"observer exit $($observer.ExitCode)"}
          $txt=Get-Content game-keys-observed.txt -Raw
          function N([string]$name){
            $pattern='(?m)^'+[regex]::Escape($name)+'=(\d+)\s*$'
            $m=[regex]::Match($txt,$pattern)
            if(-not $m.Success){ throw "missing $name in observer output: $txt" }
            return [int64]$m.Groups[1].Value
          }
          $n8=N '8';$n9=N '9';$n0=N '0';$nr=N 'R';$nf2=N 'F2';$n6=N '6';$nf1=N 'F1';$ov=N 'Overlap'
          if($n8-lt70-or$n9-lt70-or$n0-lt70){throw"combo delivery too low/missing: 8=$n8 9=$n9 0=$n0"}
          $mx=[math]::Max($n8,[math]::Max($n9,$n0));$mn=[math]::Min($n8,[math]::Min($n9,$n0));if(($mx-$mn)-gt2){throw"combo imbalance: 8=$n8 9=$n9 0=$n0"}
          if($nr-lt8){throw"R delivery missing/too low: $nr"}
          if($nf2-lt1-or$n6-lt1-or$nf1-lt1){throw"Cure delivery missing: F2=$nf2 slot6=$n6 restoreF1=$nf1"}
          if($ov-ne0){throw"overlapping synthetic game keys detected: $ov"}
          "TurkishUiExactKnownGood=PASS"|Add-Content ../../recovery-report.txt
          "InitialInactive=PASS"|Add-Content ../../recovery-report.txt
          "Combo8=$n8 Combo9=$n9 Combo0=$n0"|Add-Content ../../recovery-report.txt
          "R=$nr CureF2=$nf2 CureSlot6=$n6 CureRestoreF1=$nf1"|Add-Content ../../recovery-report.txt
          "NoSyntheticKeyOverlap=PASS"|Add-Content ../../recovery-report.txt
          "GameFacing890RCureDelivery=PASS"|Add-Content ../../recovery-report.txt

      - name: Verify portable EXE and publish report
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $deps=(dumpbin /DEPENDENTS PremiumPlusCombo.exe|Out-String)
          if($deps-match'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt'){throw'external VC runtime dependency'}
          "StaticCRT=PASS"|Add-Content ../../recovery-report.txt
          "SourceSHA=$((git rev-parse HEAD).Trim())"|Add-Content ../../recovery-report.txt
          "SHA256=$((Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash)"|Add-Content ../../recovery-report.txt
          Copy-Item PremiumPlusCombo.exe ../../PremiumPlusCombo.exe -Force
          Copy-Item known-good-ui.png ../../known-good-ui.png -Force
          Copy-Item game-keys-observed.txt ../../game-keys-observed.txt -Force
          Get-Content ../../recovery-report.txt

      - name: Upload exact verified build
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-KNOWN-GOOD-FIXED
          path: |
            PremiumPlusCombo.exe
            recovery-report.txt
            known-good-ui.png
            game-keys-observed.txt
          if-no-files-found: error
