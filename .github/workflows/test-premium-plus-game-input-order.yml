name: Test Premium Plus Game Input Order

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-game-input-order.yml'
  workflow_dispatch:

concurrency:
  group: premium-plus-game-input-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ordered-key-delivery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact Rogue executable
        shell: cmd
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Verify ordered Maximum and Turbo delivery
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class PpcInputTest {
              public delegate bool EnumProc(IntPtr h, IntPtr p);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h, string n);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              public static IntPtr Find(uint pid) {
                  IntPtr r=IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) { uint p; GetWindowThreadProcessId(h,out p); if(p==pid && GetDlgItem(h,1001)!=IntPtr.Zero){r=h;return false;} return true;},IntPtr.Zero);
                  return r;
              }
          }
          "@
          function Prop([IntPtr]$h,[string]$n){ return [PpcInputTest]::GetProp($h,$n).ToInt64() }
          function Click([IntPtr]$h,[int]$x,[int]$y){ $p=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcInputTest]::SendMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$p) }
          function Snapshot([IntPtr]$h){
            return @(
              (Prop $h 'PPC_COMBO_KEY1_TAPS'),
              (Prop $h 'PPC_COMBO_KEY2_TAPS'),
              (Prop $h 'PPC_COMBO_KEY3_TAPS'),
              (Prop $h 'PPC_R_TAPS'),
              (Prop $h 'PPC_SEND_FAILURES')
            )
          }

          $p=Start-Process -FilePath (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
          $h=[IntPtr]::Zero
          for($i=0;$i-lt 80;$i++){ Start-Sleep -Milliseconds 100; $p.Refresh(); if($p.HasExited){throw "Startup exit $($p.ExitCode)"}; $h=[PpcInputTest]::Find([uint32]$p.Id); if($h-ne[IntPtr]::Zero){break} }
          if($h-eq[IntPtr]::Zero){throw 'Main window missing'}
          Start-Sleep -Milliseconds 300

          # Maximum: start, run long enough for ~120 taps/key, stop to publish diagnostics.
          Click $h 307 118
          Start-Sleep -Milliseconds 1100
          Click $h 492 118
          Start-Sleep -Milliseconds 250
          $m=Snapshot $h
          if($m[0]-lt 80 -or $m[1]-lt 80 -or $m[2]-lt 80){throw "Maximum missing combo key taps: $($m -join ',')"}
          if($m[3]-lt 12){throw "Maximum R delivery too low: $($m -join ',')"}
          if($m[4]-ne 0){throw "Maximum SendInput failures: $($m[4])"}
          $spread=([Math]::Max($m[0],[Math]::Max($m[1],$m[2]))-[Math]::Min($m[0],[Math]::Min($m[1],$m[2])))
          if($spread-gt 2){throw "Maximum sequence imbalance: $($m[0]),$($m[1]),$($m[2])"}
          "MaximumOrderedDelivery=PASS key1=$($m[0]) key2=$($m[1]) key3=$($m[2]) R=$($m[3])" | Set-Content game-input-test.txt

          # Turbo: select mode before start. Counters reset on each activation.
          Click $h 502 209
          Start-Sleep -Milliseconds 100
          Click $h 307 118
          Start-Sleep -Milliseconds 1100
          Click $h 492 118
          Start-Sleep -Milliseconds 250
          $t=Snapshot $h
          if($t[0]-lt 160 -or $t[1]-lt 160 -or $t[2]-lt 160){throw "Turbo missing combo key taps: $($t -join ',')"}
          if($t[3]-lt 20){throw "Turbo R delivery too low: $($t -join ',')"}
          if($t[4]-ne 0){throw "Turbo SendInput failures: $($t[4])"}
          $spread=([Math]::Max($t[0],[Math]::Max($t[1],$t[2]))-[Math]::Min($t[0],[Math]::Min($t[1],$t[2])))
          if($spread-gt 2){throw "Turbo sequence imbalance: $($t[0]),$($t[1]),$($t[2])"}
          "TurboOrderedDelivery=PASS key1=$($t[0]) key2=$($t[1]) key3=$($t[2]) R=$($t[3])" | Add-Content game-input-test.txt
          "NoBatchedZeroDurationTaps=PASS" | Add-Content game-input-test.txt

          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-GameInputOrder-Test
          path: tools/premium-plus-combo/game-input-test.txt
          if-no-files-found: error
