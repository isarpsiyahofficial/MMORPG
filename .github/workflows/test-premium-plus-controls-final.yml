name: Test Premium Plus Controls Final

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-controls-final.yml'
  workflow_dispatch:

jobs:
  controls-final:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact portable EXE
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Verify migration persistence and every control
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $ErrorActionPreference = 'Stop'

          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class PpcFinalWin32 {
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h, string n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool SetWindowText(IntPtr h, string t);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder b, int n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder b, int n);
              public delegate bool EnumProc(IntPtr h, IntPtr p);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr SendMessageText(IntPtr h, uint m, IntPtr w, StringBuilder l);
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern void keybd_event(byte v, byte s, uint f, UIntPtr x);
              [DllImport("user32.dll")] public static extern short GetKeyState(int v);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);

              public static IntPtr FindMain(uint pid) {
                  IntPtr result = IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p == pid && GetDlgItem(h, 1001) != IntPtr.Zero && GetDlgItem(h, 1401) != IntPtr.Zero) {
                          result = h;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }

              public static IntPtr FindDialog(uint pid) {
                  IntPtr result = IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) {
                      uint p;
                      GetWindowThreadProcessId(h, out p);
                      if (p != pid) return true;
                      var b = new StringBuilder(64);
                      GetClassName(h, b, b.Capacity);
                      if (b.ToString() == "#32770") {
                          result = h;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }
          }
          "@

          function Get-PropValue([IntPtr]$Window, [string]$Name) {
              return [PpcFinalWin32]::GetProp($Window, $Name).ToInt64()
          }

          function Get-Control([IntPtr]$Window, [int]$Id) {
              return [PpcFinalWin32]::GetDlgItem($Window, $Id)
          }

          function Get-ControlText([IntPtr]$Control) {
              $b = New-Object System.Text.StringBuilder 256
              [void][PpcFinalWin32]::SendMessageText($Control, 0x000D, [IntPtr]$b.Capacity, $b)
              return $b.ToString()
          }

          function Get-WindowTitle([IntPtr]$Window) {
              $b = New-Object System.Text.StringBuilder 256
              [void][PpcFinalWin32]::GetWindowText($Window, $b, $b.Capacity)
              return $b.ToString()
          }

          function Press-Key([byte]$Vk) {
              [PpcFinalWin32]::keybd_event($Vk, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Milliseconds 90
              [PpcFinalWin32]::keybd_event($Vk, 0, 2, [UIntPtr]::Zero)
              Start-Sleep -Milliseconds 200
          }

          function Button-Click([IntPtr]$Control) {
              [void][PpcFinalWin32]::SendMessage($Control, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
              Start-Sleep -Milliseconds 150
          }

          function Parent-Click([IntPtr]$Window, [int]$X, [int]$Y) {
              $lp = (($Y -band 0xffff) -shl 16) -bor ($X -band 0xffff)
              [void][PpcFinalWin32]::SendMessage($Window, 0x0202, [IntPtr]::Zero, [IntPtr]$lp)
              Start-Sleep -Milliseconds 160
          }

          function Parent-Post([IntPtr]$Window, [int]$X, [int]$Y) {
              $lp = (($Y -band 0xffff) -shl 16) -bor ($X -band 0xffff)
              [void][PpcFinalWin32]::PostMessage($Window, 0x0202, [IntPtr]::Zero, [IntPtr]$lp)
          }

          function Is-Checked([IntPtr]$Control) {
              return [PpcFinalWin32]::SendMessage($Control, 0x00F0, [IntPtr]::Zero, [IntPtr]::Zero).ToInt64() -eq 1
          }

          function Set-ComboIndex([IntPtr]$Control, [int]$Index) {
              [void][PpcFinalWin32]::SendMessage($Control, 0x014E, [IntPtr]$Index, [IntPtr]::Zero)
              Start-Sleep -Milliseconds 80
          }

          function Get-ComboIndex([IntPtr]$Control) {
              return [PpcFinalWin32]::SendMessage($Control, 0x0147, [IntPtr]::Zero, [IntPtr]::Zero).ToInt64()
          }

          function Start-App {
              $proc = Start-Process -FilePath (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
              $window = [IntPtr]::Zero
              for ($i = 0; $i -lt 100; $i++) {
                  Start-Sleep -Milliseconds 100
                  $proc.Refresh()
                  if ($proc.HasExited) { throw "App exited during startup: $($proc.ExitCode)" }
                  $window = [PpcFinalWin32]::FindMain([uint32]$proc.Id)
                  if ($window -ne [IntPtr]::Zero) { break }
              }
              if ($window -eq [IntPtr]::Zero) { throw 'Main window missing' }
              Start-Sleep -Milliseconds 500
              return @($proc, $window)
          }

          function Stop-App($Proc) {
              if ($null -ne $Proc -and -not $Proc.HasExited) {
                  Stop-Process -Id $Proc.Id -Force
                  Start-Sleep -Milliseconds 350
              }
          }

          function Wait-SaveDialog([uint32]$ProcessId) {
              $dialog = [IntPtr]::Zero
              for ($i = 0; $i -lt 50; $i++) {
                  Start-Sleep -Milliseconds 100
                  $dialog = [PpcFinalWin32]::FindDialog($ProcessId)
                  if ($dialog -ne [IntPtr]::Zero) { break }
              }
              if ($dialog -eq [IntPtr]::Zero) { throw 'Save confirmation dialog missing' }
              $title = Get-WindowTitle $dialog
              if ($title -ne 'Premium Plus Combo') { throw "Unexpected save warning dialog: $title" }
              [void][PpcFinalWin32]::SendMessage($dialog, 0x0111, [IntPtr]1, [IntPtr]::Zero)
              Start-Sleep -Milliseconds 250
          }

          function Save-Screenshot([IntPtr]$Window, [string]$Name) {
              $bitmap = New-Object System.Drawing.Bitmap 800,500
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $dc = $graphics.GetHdc()
              $ok = [PpcFinalWin32]::PrintWindow($Window, $dc, 0)
              $graphics.ReleaseHdc($dc)
              $graphics.Dispose()
              if (-not $ok) { $bitmap.Dispose(); throw 'PrintWindow failed' }
              $bitmap.Save((Join-Path (Get-Location) $Name), [System.Drawing.Imaging.ImageFormat]::Png)
              $bitmap.Dispose()
          }

          $keyPath = 'HKCU:\Software\PremiumPlusCombo\RogueV2'

          # A. Fresh install: CAPS/CAPS must be persisted, not only shown in memory.
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          $launch = Start-App
          $proc = $launch[0]
          $window = [IntPtr]$launch[1]
          if ((Get-ControlText (Get-Control $window 1301)) -ne 'CAPS LOCK') { throw 'Fresh start hotkey is not CAPS LOCK' }
          if ((Get-ControlText (Get-Control $window 1302)) -ne 'CAPS LOCK') { throw 'Fresh stop hotkey is not CAPS LOCK' }
          $reg = Get-ItemProperty $keyPath
          if ($reg.StartHotkey -ne 20 -or $reg.StopHotkey -ne 20 -or $reg.CapsToggleRestoreV6 -ne 1) { throw 'Fresh CAPS/CAPS defaults were not persisted' }
          Stop-App $proc

          $launch = Start-App
          $proc = $launch[0]
          $window = [IntPtr]$launch[1]
          if ((Get-ControlText (Get-Control $window 1301)) -ne 'CAPS LOCK' -or (Get-ControlText (Get-Control $window 1302)) -ne 'CAPS LOCK') { throw 'Fresh CAPS/CAPS did not survive relaunch' }
          Stop-App $proc

          # B. Accidental TAB/CAPS build, including prior V5 marker, must self-heal.
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $keyPath -Force | Out-Null
          New-ItemProperty $keyPath -Name StartHotkey -PropertyType DWord -Value 9 -Force | Out-Null
          New-ItemProperty $keyPath -Name StopHotkey -PropertyType DWord -Value 20 -Force | Out-Null
          New-ItemProperty $keyPath -Name CapsToggleDefaultV3 -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty $keyPath -Name CapsToggleRestoreV5 -PropertyType DWord -Value 1 -Force | Out-Null
          $launch = Start-App
          $proc = $launch[0]
          $window = [IntPtr]$launch[1]
          if ((Get-ControlText (Get-Control $window 1301)) -ne 'CAPS LOCK' -or (Get-ControlText (Get-Control $window 1302)) -ne 'CAPS LOCK') { throw 'TAB/CAPS upgrade was not repaired' }
          $reg = Get-ItemProperty $keyPath
          if ($reg.StartHotkey -ne 20 -or $reg.StopHotkey -ne 20 -or $reg.CapsToggleRestoreV6 -ne 1) { throw 'TAB/CAPS repair was not persisted' }
          Stop-App $proc

          # C. Genuine custom hotkeys must never be overwritten by migration.
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $keyPath -Force | Out-Null
          New-ItemProperty $keyPath -Name StartHotkey -PropertyType DWord -Value 74 -Force | Out-Null
          New-ItemProperty $keyPath -Name StopHotkey -PropertyType DWord -Value 75 -Force | Out-Null
          New-ItemProperty $keyPath -Name CureHotkey -PropertyType DWord -Value 86 -Force | Out-Null
          New-ItemProperty $keyPath -Name CapsToggleDefaultV3 -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty $keyPath -Name CapsToggleRestoreV5 -PropertyType DWord -Value 1 -Force | Out-Null
          $launch = Start-App
          $proc = $launch[0]
          $window = [IntPtr]$launch[1]
          if ((Get-ControlText (Get-Control $window 1301)) -ne 'J' -or (Get-ControlText (Get-Control $window 1302)) -ne 'K') { throw 'Custom J/K hotkeys were overwritten by migration' }
          if ((Get-ControlText (Get-Control $window 1204)) -ne 'V') { throw 'Custom Cure V hotkey was not preserved' }
          if ((Get-PropValue $window 'PPC_ACTIVE') -ne 0) { throw 'App auto-started' }

          foreach ($id in @(1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302,1401)) {
              $control = Get-Control $window $id
              if ($control -eq [IntPtr]::Zero -or -not [PpcFinalWin32]::IsWindowVisible($control)) { throw "Control $id missing or hidden" }
          }

          Save-Screenshot $window 'ui-before-controls.png'

          # D. Edit and save every ordinary Rogue setting.
          [void][PpcFinalWin32]::SetWindowText((Get-Control $window 1001), '1')
          [void][PpcFinalWin32]::SetWindowText((Get-Control $window 1002), '2')
          [void][PpcFinalWin32]::SetWindowText((Get-Control $window 1003), '3')
          if (Is-Checked (Get-Control $window 1101)) { Button-Click (Get-Control $window 1101) }
          [void][PpcFinalWin32]::SetWindowText((Get-Control $window 1102), '33')
          [void][PpcFinalWin32]::SetWindowText((Get-Control $window 1103), '44')
          if (Is-Checked (Get-Control $window 1201)) { Button-Click (Get-Control $window 1201) }
          Set-ComboIndex (Get-Control $window 1202) 4
          Set-ComboIndex (Get-Control $window 1203) 6

          Parent-Post $window 400 452
          Wait-SaveDialog ([uint32]$proc.Id)
          $reg = Get-ItemProperty $keyPath
          if ($reg.Seq1 -ne 49 -or $reg.Seq2 -ne 50 -or $reg.Seq3 -ne 51) { throw 'Sequence save failed' }
          if ($reg.REnabled -ne 0 -or $reg.RMax -ne 33 -or $reg.RTurbo -ne 44) { throw 'R settings save failed' }
          if ($reg.CureEnabled -ne 0 -or $reg.CureBar -ne 5 -or $reg.CureSlot -ne 7) { throw 'Cure settings save failed' }

          Stop-App $proc
          $launch = Start-App
          $proc = $launch[0]
          $window = [IntPtr]$launch[1]
          if ((Get-ControlText (Get-Control $window 1001)) -ne '1' -or (Get-ControlText (Get-Control $window 1002)) -ne '2' -or (Get-ControlText (Get-Control $window 1003)) -ne '3') { throw 'Sequence reload failed' }
          if (Is-Checked (Get-Control $window 1101)) { throw 'R checkbox reload failed' }
          if ((Get-ControlText (Get-Control $window 1102)) -ne '33' -or (Get-ControlText (Get-Control $window 1103)) -ne '44') { throw 'R rate reload failed' }
          if (Is-Checked (Get-Control $window 1201)) { throw 'Cure checkbox reload failed' }
          if ((Get-ComboIndex (Get-Control $window 1202)) -ne 4 -or (Get-ComboIndex (Get-Control $window 1203)) -ne 6) { throw 'Cure selectors reload failed' }

          # E. Custom global start/stop are functional.
          Press-Key 74
          if ((Get-PropValue $window 'PPC_ACTIVE') -ne 1) { throw 'Custom J start failed' }
          Start-Sleep -Milliseconds 450
          if ((Get-PropValue $window 'PPC_R_PRESSES') -ne 0) { throw 'R emitted while R Combo disabled' }
          if ((Get-PropValue $window 'PPC_COMBO_BURSTS') -le 0) { throw 'Combo engine did not run' }
          Press-Key 75
          if ((Get-PropValue $window 'PPC_ACTIVE') -ne 0) { throw 'Custom K stop failed' }

          # F. R Combo checkbox, Start/Stop buttons and runtime R output.
          Button-Click (Get-Control $window 1101)
          Parent-Click $window 307 118
          Start-Sleep -Milliseconds 500
          if ((Get-PropValue $window 'PPC_ACTIVE') -ne 1) { throw 'Start button failed' }
          if ((Get-PropValue $window 'PPC_R_PRESSES') -le 0) { throw 'R Combo checkbox/runtime failed' }
          Parent-Click $window 492 118
          if ((Get-PropValue $window 'PPC_ACTIVE') -ne 0) { throw 'Stop button failed' }

          # G. Cure checkbox, Cure hotkey and Cure worker.
          Button-Click (Get-Control $window 1201)
          Parent-Click $window 307 118
          Start-Sleep -Milliseconds 250
          $cureBefore = Get-PropValue $window 'PPC_CURE_RUNS'
          Press-Key 86
          Start-Sleep -Milliseconds 500
          if ((Get-PropValue $window 'PPC_CURE_RUNS') -le $cureBefore) { throw 'Cure hotkey/runtime failed' }
          Parent-Click $window 492 118

          # H. Both mode cards.
          Parent-Click $window 502 209
          if ((Get-PropValue $window 'PPC_MODE') -ne 1) { throw 'Turbo mode card failed' }
          Parent-Click $window 297 209
          if ((Get-PropValue $window 'PPC_MODE') -ne 0) { throw 'Maximum mode card failed' }

          # I. Master power disables all settings and never auto-starts on re-enable.
          $power = Get-Control $window 1401
          [void][PpcFinalWin32]::SendMessage($power, 0x0202, [IntPtr]::Zero, [IntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          if ((Get-PropValue $window 'PPC_POWER_ENABLED') -ne 0 -or (Get-PropValue $window 'PPC_ACTIVE') -ne 0) { throw 'Master power OFF failed' }
          foreach ($id in @(1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302)) {
              if ([PpcFinalWin32]::IsWindowEnabled((Get-Control $window $id))) { throw "Control $id remained enabled while power OFF" }
          }
          [void][PpcFinalWin32]::SendMessage($power, 0x0202, [IntPtr]::Zero, [IntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          if ((Get-PropValue $window 'PPC_POWER_ENABLED') -ne 1 -or (Get-PropValue $window 'PPC_ACTIVE') -ne 0) { throw 'Master power ON failed or auto-started' }

          Save-Screenshot $window 'ui-all-controls-verified.png'

          "SourceSHA=$((git rev-parse HEAD).Trim())" | Set-Content final-controls-report.txt
          @(
              'FreshCapsPersistence=PASS',
              'FreshRelaunch=PASS',
              'LegacyTabCapsRepair=PASS',
              'CustomHotkeysPreserved=PASS',
              'InitialInactive=PASS',
              'VisibleControls=PASS',
              'SequenceSaveReload=PASS',
              'RSettingsSaveReload=PASS',
              'CureSettingsSaveReload=PASS',
              'CustomStartStopRuntime=PASS',
              'RComboRuntime=PASS',
              'CureRuntime=PASS',
              'StartStopButtons=PASS',
              'ModeCards=PASS',
              'MasterPower=PASS',
              'AllInteractiveControls=PASS'
          ) | Add-Content final-controls-report.txt
          "SHA256=$((Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash)" | Add-Content final-controls-report.txt
          Stop-App $proc

      - name: Verify static portable dependencies
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $deps = (dumpbin /DEPENDENTS PremiumPlusCombo.exe | Out-String)
          $deps | Set-Content final-dependencies.txt
          if ($deps -match 'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt') { throw 'External VC runtime dependency detected' }
          'StaticCRT=PASS' | Add-Content final-controls-report.txt

      - name: Upload fully verified build
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-FINAL-CONTROLS-VERIFIED
          path: |
            tools/premium-plus-combo/PremiumPlusCombo.exe
            tools/premium-plus-combo/final-controls-report.txt
            tools/premium-plus-combo/final-dependencies.txt
            tools/premium-plus-combo/ui-before-controls.png
            tools/premium-plus-combo/ui-all-controls-verified.png
          if-no-files-found: error
