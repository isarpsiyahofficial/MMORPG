name: Test Premium Plus Controls V3

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - '.github/workflows/test-premium-plus-controls-v3.yml'
  workflow_dispatch:

jobs:
  controls-regression-v3:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib
      - name: Exercise controls
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $ErrorActionPreference='Stop'
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Force|Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' StartHotkey -PropertyType DWord -Value 9 -Force|Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' StopHotkey -PropertyType DWord -Value 20 -Force|Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' CapsToggleDefaultV3 -PropertyType DWord -Value 1 -Force|Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' TabStartCapsStopDefaultV4 -PropertyType DWord -Value 1 -Force|Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h,string n);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern bool SetWindowText(IntPtr h,string t);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder b,int n);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder b,int n);
            public delegate bool EP(IntPtr h,IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EP p,IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint p);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h,int id);
            [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll",CharSet=CharSet.Unicode,EntryPoint="SendMessageW")] public static extern IntPtr SendMessageText(IntPtr h,uint m,IntPtr w,StringBuilder l);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern void keybd_event(byte v,byte s,uint f,UIntPtr x);
            [DllImport("user32.dll")] public static extern short GetKeyState(int v);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);
            public static IntPtr Main(uint pid){IntPtr r=IntPtr.Zero;EnumWindows(delegate(IntPtr h,IntPtr l){uint p;GetWindowThreadProcessId(h,out p);if(p==pid&&GetDlgItem(h,1001)!=IntPtr.Zero&&GetDlgItem(h,1302)!=IntPtr.Zero){r=h;return false;}return true;},IntPtr.Zero);return r;}
            public static IntPtr Dialog(uint pid){IntPtr r=IntPtr.Zero;EnumWindows(delegate(IntPtr h,IntPtr l){uint p;GetWindowThreadProcessId(h,out p);if(p!=pid)return true;var b=new StringBuilder(64);GetClassName(h,b,b.Capacity);if(b.ToString()=="#32770"){r=h;return false;}return true;},IntPtr.Zero);return r;}
          }
          "@
          function C([IntPtr]$h,[int]$id){[W]::GetDlgItem($h,$id)}
          function T([IntPtr]$h){$b=New-Object Text.StringBuilder 256;[void][W]::SendMessageText($h,0x000D,[IntPtr]$b.Capacity,$b);$b.ToString()}
          function WT([IntPtr]$h){$b=New-Object Text.StringBuilder 256;[void][W]::GetWindowText($h,$b,$b.Capacity);$b.ToString()}
          function P([IntPtr]$h,[string]$n){[W]::GetProp($h,$n).ToInt64()}
          function K([byte]$v){[W]::keybd_event($v,0,0,[UIntPtr]::Zero);Start-Sleep -Milliseconds 90;[W]::keybd_event($v,0,2,[UIntPtr]::Zero);Start-Sleep -Milliseconds 200}
          function BC([IntPtr]$h){[void][W]::SendMessage($h,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero);Start-Sleep -Milliseconds 160}
          function PC([IntPtr]$h,[int]$x,[int]$y){$lp=(($y-band 65535)-shl 16)-bor($x-band 65535);[void][W]::SendMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$lp);Start-Sleep -Milliseconds 150}
          function PP([IntPtr]$h,[int]$x,[int]$y){$lp=(($y-band 65535)-shl 16)-bor($x-band 65535);[void][W]::PostMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$lp)}
          function CC([IntPtr]$h){[W]::SendMessage($h,0x00F0,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64()-eq 1}
          function CS([IntPtr]$h,[int]$i){[void][W]::SendMessage($h,0x014E,[IntPtr]$i,[IntPtr]::Zero)}
          function CG([IntPtr]$h){[W]::SendMessage($h,0x0147,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64()}
          function Shot([IntPtr]$h,[string]$n){$b=New-Object Drawing.Bitmap 800,500;$g=[Drawing.Graphics]::FromImage($b);$dc=$g.GetHdc();$ok=[W]::PrintWindow($h,$dc,0);$g.ReleaseHdc($dc);$g.Dispose();if(-not$ok){throw'PrintWindow failed'};$b.Save((Join-Path (Get-Location) $n),[Drawing.Imaging.ImageFormat]::Png);$b.Dispose()}
          function LaunchApp{$p=Start-Process (Resolve-Path .\PremiumPlusCombo.exe) -PassThru;$h=[IntPtr]::Zero;1..100|%{Start-Sleep -Milliseconds 100;$p.Refresh();if($p.HasExited){throw'Exited'};$h=[W]::Main([uint32]$p.Id);if($h-ne[IntPtr]::Zero){return @($p,$h)}};throw'Main missing'}
          function DialogInfo([uint32]$processId){$d=[IntPtr]::Zero;1..50|%{Start-Sleep -Milliseconds 100;$d=[W]::Dialog($processId);if($d-ne[IntPtr]::Zero){return @($d,(WT $d))}};throw'Dialog missing'}
          function CloseDlg([IntPtr]$d){[void][W]::SendMessage($d,0x0111,[IntPtr]1,[IntPtr]::Zero);Start-Sleep -Milliseconds 250}

          $x=LaunchApp;$proc=$x[0];$h=[IntPtr]$x[1]
          if((T (C $h 1301))-ne'CAPS LOCK'-or(T (C $h 1302))-ne'CAPS LOCK'){throw'Migration failed'}
          $r=Get-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2';if($r.StartHotkey-ne20-or$r.StopHotkey-ne20-or$r.CapsToggleRestoreV5-ne1){throw'Migration persistence failed'}
          if((P $h 'PPC_ACTIVE')-ne0){throw'Auto start'}
          Shot $h 'ui-locked.png'
          $cap=[W]::GetKeyState(20)-band 1;K 20;if((P $h 'PPC_ACTIVE')-ne1){throw'Caps start'};K 20;if((P $h 'PPC_ACTIVE')-ne0){throw'Caps stop'};if(([W]::GetKeyState(20)-band 1)-ne$cap){throw'Caps state changed'}

          # Save ordinary settings first while known-good CAPS/CAPS remains registered.
          [void][W]::SetWindowText((C $h 1001),'1');[void][W]::SetWindowText((C $h 1002),'2');[void][W]::SetWindowText((C $h 1003),'3')
          if(CC (C $h 1101)){BC (C $h 1101)};[void][W]::SetWindowText((C $h 1102),'33');[void][W]::SetWindowText((C $h 1103),'44')
          if(CC (C $h 1201)){BC (C $h 1201)};CS (C $h 1202) 4;CS (C $h 1203) 6
          PP $h 400 452;$di=DialogInfo ([uint32]$proc.Id);$dlg=[IntPtr]$di[0];$title=$di[1]
          "FirstSaveDialog=$title"|Set-Content controls-v3-report.txt
          if($title-ne'Premium Plus Combo'){throw "Save produced warning dialog: $title"}
          CloseDlg $dlg
          $r=Get-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2'
          "AfterFirstSave=Seq:$($r.Seq1),$($r.Seq2),$($r.Seq3) R:$($r.REnabled),$($r.RMax),$($r.RTurbo) Cure:$($r.CureEnabled),$($r.CureBar),$($r.CureSlot)"|Add-Content controls-v3-report.txt
          if($r.Seq1-ne49-or$r.Seq2-ne50-or$r.Seq3-ne51){throw'Sequence save failed'}
          if($r.REnabled-ne0-or$r.RMax-ne33-or$r.RTurbo-ne44){throw'R save failed'}
          if($r.CureEnabled-ne0-or$r.CureBar-ne5-or$r.CureSlot-ne7){throw'Cure save failed'}

          # Assign separate custom keys using ordinary letters that are not reserved by the runner.
          BC (C $h 1301);K 74;if((T (C $h 1301))-ne'J'){throw'Start assign J failed'}
          BC (C $h 1302);K 75;if((T (C $h 1302))-ne'K'){throw'Stop assign K failed'}
          BC (C $h 1204);K 86;if((T (C $h 1204))-ne'V'){throw'Cure assign V failed'}
          PP $h 400 452;$di=DialogInfo ([uint32]$proc.Id);$dlg=[IntPtr]$di[0];$title=$di[1]
          "CustomSaveDialog=$title"|Add-Content controls-v3-report.txt
          if($title-ne'Premium Plus Combo'){throw "Custom-key save warning: $title"};CloseDlg $dlg
          $r=Get-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2';"CustomSaved=$($r.StartHotkey),$($r.StopHotkey),$($r.CureHotkey)"|Add-Content controls-v3-report.txt
          if($r.StartHotkey-ne74-or$r.StopHotkey-ne75-or$r.CureHotkey-ne86){throw'Custom keys not saved'}

          Stop-Process -Id $proc.Id -Force;Start-Sleep -Milliseconds 400;$x=LaunchApp;$proc=$x[0];$h=[IntPtr]$x[1]
          if((T(C $h 1001))-ne'1'-or(T(C $h 1002))-ne'2'-or(T(C $h 1003))-ne'3'){throw'Sequence reload'}
          if((T(C $h 1301))-ne'J'-or(T(C $h 1302))-ne'K'-or(T(C $h 1204))-ne'V'){throw'Custom reload'}
          K 74;if((P $h 'PPC_ACTIVE')-ne1){throw'J start runtime'};Start-Sleep -Milliseconds 450;if((P $h 'PPC_R_PRESSES')-ne0){throw'R fired disabled'};K 75;if((P $h 'PPC_ACTIVE')-ne0){throw'K stop runtime'}
          BC(C $h 1101);PC $h 307 118;Start-Sleep -Milliseconds 500;if((P $h 'PPC_R_PRESSES')-le0){throw'R enable runtime'};PC $h 492 118
          BC(C $h 1201);PC $h 307 118;Start-Sleep -Milliseconds 250;$c0=P $h 'PPC_CURE_RUNS';K 86;Start-Sleep -Milliseconds 500;if((P $h 'PPC_CURE_RUNS')-le$c0){throw'Cure runtime'};PC $h 492 118
          PC $h 502 209;if((P $h 'PPC_MODE')-ne1){throw'Turbo'};PC $h 297 209;if((P $h 'PPC_MODE')-ne0){throw'Maximum'}
          $pow=C $h 1401;[void][W]::SendMessage($pow,0x0202,[IntPtr]::Zero,[IntPtr]0);Start-Sleep -Milliseconds 200;if((P $h 'PPC_POWER_ENABLED')-ne0){throw'Power off'};foreach($id in 1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302){if([W]::IsWindowEnabled((C $h $id))){throw"Enabled while off $id"}};[void][W]::SendMessage($pow,0x0202,[IntPtr]::Zero,[IntPtr]0);Start-Sleep -Milliseconds 200;if((P $h 'PPC_POWER_ENABLED')-ne1-or(P $h 'PPC_ACTIVE')-ne0){throw'Power on'}
          Shot $h 'ui-controls-verified.png'
          @('Migration=PASS','InitialInactive=PASS','DefaultCapsToggle=PASS','SequenceSaveReload=PASS','RControls=PASS','CureControls=PASS','StartStopAssignment=PASS','CureAssignment=PASS','CustomKeyPersistence=PASS','CustomRuntime=PASS','RRuntime=PASS','CureRuntime=PASS','Modes=PASS','Power=PASS','AllInteractiveControls=PASS')|Add-Content controls-v3-report.txt
          "SourceSHA=$((git rev-parse HEAD).Trim())"|Add-Content controls-v3-report.txt
          "SHA256=$((Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash)"|Add-Content controls-v3-report.txt
          Stop-Process -Id $proc.Id -Force
      - name: Static runtime check
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $d=(dumpbin /DEPENDENTS PremiumPlusCombo.exe|Out-String);$d|Set-Content controls-v3-dependencies.txt;if($d-match'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt'){throw'External runtime'};'StaticCRT=PASS'|Add-Content controls-v3-report.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-Controls-V3
          path: |
            tools/premium-plus-combo/PremiumPlusCombo.exe
            tools/premium-plus-combo/controls-v3-report.txt
            tools/premium-plus-combo/controls-v3-dependencies.txt
            tools/premium-plus-combo/ui-locked.png
            tools/premium-plus-combo/ui-controls-verified.png
          if-no-files-found: warn
