name: Test Premium Plus Final Delivery

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - '.github/workflows/test-premium-plus-final-delivery.yml'
  workflow_dispatch:

jobs:
  final-delivery:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact portable EXE
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Exercise every visible control and persistence path
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class PpcFinal {
              public delegate bool EnumProc(IntPtr h, IntPtr p);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h, string n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder b, int n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder b, int n);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr SendMessageGetText(IntPtr h, uint m, IntPtr w, StringBuilder l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr SendMessageSetText(IntPtr h, uint m, IntPtr w, string l);
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern void keybd_event(byte v, byte s, uint f, UIntPtr x);
              [DllImport("user32.dll")] public static extern short GetKeyState(int v);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);

              public static IntPtr FindMain(uint pid) {
                  IntPtr r = IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) {
                      uint p; GetWindowThreadProcessId(h, out p);
                      if (p == pid && GetDlgItem(h, 1001) != IntPtr.Zero && GetDlgItem(h, 1401) != IntPtr.Zero) { r = h; return false; }
                      return true;
                  }, IntPtr.Zero);
                  return r;
              }

              public static IntPtr FindDialog(uint pid) {
                  IntPtr r = IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) {
                      uint p; GetWindowThreadProcessId(h, out p);
                      if (p != pid) return true;
                      var b = new StringBuilder(64); GetClassName(h, b, b.Capacity);
                      if (b.ToString() == "#32770") { r = h; return false; }
                      return true;
                  }, IntPtr.Zero);
                  return r;
              }
          }
          "@

          function Ctrl([IntPtr]$w,[int]$id) { [PpcFinal]::GetDlgItem($w,$id) }
          function Prop([IntPtr]$w,[string]$n) { [PpcFinal]::GetProp($w,$n).ToInt64() }
          function Text([IntPtr]$h) { $b=New-Object System.Text.StringBuilder 256; [void][PpcFinal]::SendMessageGetText($h,0x000D,[IntPtr]$b.Capacity,$b); $b.ToString() }
          function SetText([IntPtr]$h,[string]$s) { [void][PpcFinal]::SendMessageSetText($h,0x000C,[IntPtr]::Zero,$s); Start-Sleep -Milliseconds 80 }
          function Checked([IntPtr]$h) { [PpcFinal]::SendMessage($h,0x00F0,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64() -eq 1 }
          function ButtonClick([IntPtr]$h) { [void][PpcFinal]::SendMessage($h,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero); Start-Sleep -Milliseconds 170 }
          function ComboSet([IntPtr]$h,[int]$i) { [void][PpcFinal]::SendMessage($h,0x014E,[IntPtr]$i,[IntPtr]::Zero); Start-Sleep -Milliseconds 100 }
          function ComboGet([IntPtr]$h) { [PpcFinal]::SendMessage($h,0x0147,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64() }
          function Key([byte]$v) { [PpcFinal]::keybd_event($v,0,0,[UIntPtr]::Zero); Start-Sleep -Milliseconds 100; [PpcFinal]::keybd_event($v,0,2,[UIntPtr]::Zero); Start-Sleep -Milliseconds 230 }
          function ParentClick([IntPtr]$w,[int]$x,[int]$y) { $lp=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcFinal]::SendMessage($w,0x0202,[IntPtr]::Zero,[IntPtr]$lp); Start-Sleep -Milliseconds 180 }
          function ParentPost([IntPtr]$w,[int]$x,[int]$y) { $lp=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcFinal]::PostMessage($w,0x0202,[IntPtr]::Zero,[IntPtr]$lp) }
          function PowerClick([IntPtr]$h) { [void][PpcFinal]::SendMessage($h,0x0201,[IntPtr]1,[IntPtr]::Zero); [void][PpcFinal]::SendMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]::Zero); Start-Sleep -Milliseconds 230 }
          function Shot([IntPtr]$w,[string]$n) { $b=New-Object System.Drawing.Bitmap 800,500; $g=[System.Drawing.Graphics]::FromImage($b); $dc=$g.GetHdc(); $ok=[PpcFinal]::PrintWindow($w,$dc,0); $g.ReleaseHdc($dc); $g.Dispose(); if(-not $ok){$b.Dispose();throw 'PrintWindow failed'}; $b.Save((Join-Path (Get-Location) $n),[System.Drawing.Imaging.ImageFormat]::Png); $b.Dispose() }

          function Launch {
              $proc=Start-Process -FilePath (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
              $w=[IntPtr]::Zero
              for($i=0;$i-lt 100;$i++){ Start-Sleep -Milliseconds 100; $proc.Refresh(); if($proc.HasExited){throw "startup exit $($proc.ExitCode)"}; $w=[PpcFinal]::FindMain([uint32]$proc.Id); if($w-ne[IntPtr]::Zero){break} }
              if($w-eq[IntPtr]::Zero){throw 'main window missing'}
              Start-Sleep -Milliseconds 450
              @($proc,$w)
          }
          function Kill($proc) { if($null-ne$proc -and -not$proc.HasExited){Stop-Process -Id $proc.Id -Force;Start-Sleep -Milliseconds 350} }
          function DialogTitle([IntPtr]$d) { $b=New-Object System.Text.StringBuilder 128; [void][PpcFinal]::GetWindowText($d,$b,$b.Capacity); $b.ToString() }
          function WaitSave([uint32]$processId) {
              $d=[IntPtr]::Zero
              for($i=0;$i-lt 50;$i++){Start-Sleep -Milliseconds 100;$d=[PpcFinal]::FindDialog($processId);if($d-ne[IntPtr]::Zero){break}}
              if($d-eq[IntPtr]::Zero){throw 'save dialog missing'}
              $title=DialogTitle $d
              if($title-ne'Premium Plus Combo'){throw "save failed with dialog: $title"}
              [void][PpcFinal]::SendMessage($d,0x0111,[IntPtr]1,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 250
          }

          $regPath='HKCU:\Software\PremiumPlusCombo\RogueV2'

          # 1) Clean launch: intended CAPS/CAPS toggle must persist across relaunch.
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          $x=Launch;$proc=$x[0];$w=[IntPtr]$x[1]
          if((Prop $w 'PPC_ACTIVE')-ne0){throw 'app auto-started'}
          if((Text(Ctrl $w 1301))-ne'CAPS LOCK'-or(Text(Ctrl $w 1302))-ne'CAPS LOCK'){throw 'clean default hotkeys wrong'}
          $r=Get-ItemProperty $regPath
          if($r.StartHotkey-ne20-or$r.StopHotkey-ne20-or$r.CapsToggleRestoreV6-ne1){throw 'clean CAPS/CAPS not persisted'}
          foreach($id in 1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302,1401){$c=Ctrl $w $id;if($c-eq[IntPtr]::Zero-or-not[PpcFinal]::IsWindowVisible($c)){throw "missing/hidden control $id"}}
          Shot $w 'ui-final-before.png'

          $caps0=[PpcFinal]::GetKeyState(20)-band 1
          Key 20;if((Prop $w 'PPC_ACTIVE')-ne1){throw 'CAPS toggle failed to start'}
          Key 20;if((Prop $w 'PPC_ACTIVE')-ne0){throw 'CAPS toggle failed to stop'}
          if(([PpcFinal]::GetKeyState(20)-band 1)-ne$caps0){throw 'CAPS changed Windows lock state'}
          Kill $proc
          $x=Launch;$proc=$x[0];$w=[IntPtr]$x[1]
          if((Text(Ctrl $w 1301))-ne'CAPS LOCK'-or(Text(Ctrl $w 1302))-ne'CAPS LOCK'){throw 'CAPS/CAPS did not survive relaunch'}
          Kill $proc

          # 2) Exact bad TAB/CAPS state from intermediate build self-heals even with old markers.
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $regPath -Force|Out-Null
          New-ItemProperty $regPath StartHotkey -PropertyType DWord -Value 9 -Force|Out-Null
          New-ItemProperty $regPath StopHotkey -PropertyType DWord -Value 20 -Force|Out-Null
          New-ItemProperty $regPath CapsToggleDefaultV3 -PropertyType DWord -Value 1 -Force|Out-Null
          New-ItemProperty $regPath CapsToggleRestoreV5 -PropertyType DWord -Value 1 -Force|Out-Null
          $x=Launch;$proc=$x[0];$w=[IntPtr]$x[1]
          $r=Get-ItemProperty $regPath
          if((Text(Ctrl $w 1301))-ne'CAPS LOCK'-or(Text(Ctrl $w 1302))-ne'CAPS LOCK'-or$r.StartHotkey-ne20-or$r.StopHotkey-ne20-or$r.CapsToggleRestoreV6-ne1){throw 'bad TAB/CAPS state not repaired/persisted'}

          # 3) Use the three actual hotkey assignment buttons: Start=J, Stop=K, Cure=V.
          ButtonClick (Ctrl $w 1301);Key 74;if((Text(Ctrl $w 1301))-ne'J'){throw 'Start hotkey assignment button failed'}
          ButtonClick (Ctrl $w 1302);Key 75;if((Text(Ctrl $w 1302))-ne'K'){throw 'Stop hotkey assignment button failed'}
          ButtonClick (Ctrl $w 1204);Key 86;if((Text(Ctrl $w 1204))-ne'V'){throw 'Cure hotkey assignment button failed'}

          # 4) Edit every ordinary setting using real WM_SETTEXT / combo / checkbox messages.
          SetText (Ctrl $w 1001) '1';SetText (Ctrl $w 1002) '2';SetText (Ctrl $w 1003) '3'
          if((Text(Ctrl $w 1001))-ne'1'-or(Text(Ctrl $w 1002))-ne'2'-or(Text(Ctrl $w 1003))-ne'3'){throw 'sequence edit controls rejected text'}
          if(Checked(Ctrl $w 1101)){ButtonClick(Ctrl $w 1101)}
          SetText (Ctrl $w 1102) '33';SetText (Ctrl $w 1103) '44'
          if(Checked(Ctrl $w 1201)){ButtonClick(Ctrl $w 1201)}
          ComboSet (Ctrl $w 1202) 4;ComboSet (Ctrl $w 1203) 6

          # 5) Real Save hit area must apply, persist, confirm, and reload all values.
          ParentPost $w 400 452;WaitSave ([uint32]$proc.Id)
          $r=Get-ItemProperty $regPath
          if($r.Seq1-ne49-or$r.Seq2-ne50-or$r.Seq3-ne51){throw "sequence save mismatch $($r.Seq1),$($r.Seq2),$($r.Seq3)"}
          if($r.REnabled-ne0-or$r.RMax-ne33-or$r.RTurbo-ne44){throw 'R settings save mismatch'}
          if($r.CureEnabled-ne0-or$r.CureBar-ne5-or$r.CureSlot-ne7-or$r.CureHotkey-ne86){throw 'Cure settings save mismatch'}
          if($r.StartHotkey-ne74-or$r.StopHotkey-ne75){throw 'custom start/stop save mismatch'}
          Kill $proc
          $x=Launch;$proc=$x[0];$w=[IntPtr]$x[1]
          if((Text(Ctrl $w 1001))-ne'1'-or(Text(Ctrl $w 1002))-ne'2'-or(Text(Ctrl $w 1003))-ne'3'){throw 'sequence reload failed'}
          if(Checked(Ctrl $w 1101)){throw 'R checkbox reload failed'}
          if((Text(Ctrl $w 1102))-ne'33'-or(Text(Ctrl $w 1103))-ne'44'){throw 'R rate reload failed'}
          if(Checked(Ctrl $w 1201)){throw 'Cure checkbox reload failed'}
          if((ComboGet(Ctrl $w 1202))-ne4-or(ComboGet(Ctrl $w 1203))-ne6){throw 'Cure selector reload failed'}
          if((Text(Ctrl $w 1301))-ne'J'-or(Text(Ctrl $w 1302))-ne'K'-or(Text(Ctrl $w 1204))-ne'V'){throw 'custom hotkey reload failed'}

          # 6) Custom J/K runtime and combo output.
          Key 74;if((Prop $w 'PPC_ACTIVE')-ne1){throw 'J start runtime failed'};Start-Sleep -Milliseconds 500
          if((Prop $w 'PPC_COMBO_BURSTS')-le0){throw 'combo engine did not run'}
          if((Prop $w 'PPC_R_PRESSES')-ne0){throw 'R emitted while R disabled'}
          Key 75;if((Prop $w 'PPC_ACTIVE')-ne0){throw 'K stop runtime failed'}

          # 7) R Combo checkbox + drawn Start/Stop controls.
          ButtonClick (Ctrl $w 1101)
          ParentClick $w 307 118;Start-Sleep -Milliseconds 550
          if((Prop $w 'PPC_ACTIVE')-ne1-or(Prop $w 'PPC_R_PRESSES')-le0){throw 'R Combo or Start button failed'}
          ParentClick $w 492 118;if((Prop $w 'PPC_ACTIVE')-ne0){throw 'Stop button failed'}

          # 8) Cure checkbox + V hotkey; R must pause for two seconds and then resume.
          ButtonClick (Ctrl $w 1201)
          ParentClick $w 307 118;Start-Sleep -Milliseconds 350
          $c0=Prop $w 'PPC_CURE_RUNS';$r0=Prop $w 'PPC_R_PRESSES'
          Key 86;Start-Sleep -Milliseconds 450
          if((Prop $w 'PPC_CURE_RUNS')-le$c0){throw 'Cure runtime failed'}
          $rPaused=Prop $w 'PPC_R_PRESSES'
          Start-Sleep -Milliseconds 600
          if((Prop $w 'PPC_R_PRESSES')-ne$rPaused){throw 'R did not remain paused during Cure suppression'}
          Start-Sleep -Milliseconds 1400
          if((Prop $w 'PPC_R_PRESSES')-le$rPaused){throw 'R did not resume after Cure suppression'}
          ParentClick $w 492 118

          # 9) Both mode cards are real interactive hit targets.
          ParentClick $w 502 209;if((Prop $w 'PPC_MODE')-ne1){throw 'Turbo mode control failed'}
          ParentClick $w 297 209;if((Prop $w 'PPC_MODE')-ne0){throw 'Maximum mode control failed'}

          # 10) Master power disables controls and never auto-starts on re-enable.
          $power=Ctrl $w 1401
          PowerClick $power
          if((Prop $w 'PPC_POWER_ENABLED')-ne0-or(Prop $w 'PPC_ACTIVE')-ne0){throw 'Master OFF failed'}
          foreach($id in 1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302){if([PpcFinal]::IsWindowEnabled((Ctrl $w $id))){throw "control $id enabled while master OFF"}}
          PowerClick $power
          if((Prop $w 'PPC_POWER_ENABLED')-ne1-or(Prop $w 'PPC_ACTIVE')-ne0){throw 'Master ON failed or auto-started'}

          Shot $w 'ui-final-verified.png'
          "SourceSHA=$((git rev-parse HEAD).Trim())"|Set-Content final-delivery-report.txt
          @(
            'InitialInactive=PASS','FreshCapsTogglePersistence=PASS','BadTabCapsSelfHeal=PASS','CapsStateIsolation=PASS','VisibleControls=PASS',
            'StartHotkeyAssignment=PASS','StopHotkeyAssignment=PASS','CureHotkeyAssignment=PASS','SequenceControls=PASS','RControls=PASS','CureControls=PASS',
            'SavePersistence=PASS','RelaunchPersistence=PASS','CustomStartStopRuntime=PASS','ComboRuntime=PASS','RComboRuntime=PASS','CureRuntime=PASS',
            'CureRPauseResume=PASS','StartStopButtons=PASS','ModeControls=PASS','MasterPower=PASS','AllInteractiveControls=PASS'
          )|Add-Content final-delivery-report.txt
          "SHA256=$((Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash)"|Add-Content final-delivery-report.txt
          Kill $proc

      - name: Verify portable static runtime
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $deps=(dumpbin /DEPENDENTS PremiumPlusCombo.exe|Out-String)
          $deps|Set-Content final-dependencies.txt
          if($deps-match'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt'){throw 'external VC runtime dependency detected'}
          'StaticCRT=PASS'|Add-Content final-delivery-report.txt

      - name: Upload exact verified EXE
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-FINAL-VERIFIED
          path: |
            tools/premium-plus-combo/PremiumPlusCombo.exe
            tools/premium-plus-combo/final-delivery-report.txt
            tools/premium-plus-combo/final-dependencies.txt
            tools/premium-plus-combo/ui-final-before.png
            tools/premium-plus-combo/ui-final-verified.png
          if-no-files-found: error
