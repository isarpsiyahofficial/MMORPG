name: Test Premium Plus Controls

on:
  push:
    branches: [ premium-plus-combo ]
    paths:
      - 'tools/premium-plus-combo/**'
      - '.github/workflows/test-premium-plus-controls.yml'
  workflow_dispatch:

concurrency:
  group: premium-plus-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact portable EXE
        run: |
          cd tools\premium-plus-combo
          rc /nologo /fo app.res app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE main.cpp app.res /Fe:PremiumPlusCombo.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib advapi32.lib ole32.lib winmm.lib

      - name: Test migration, every setting control and hotkeys
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $ErrorActionPreference = 'Stop'
          Remove-Item 'HKCU:\Software\PremiumPlusCombo' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Force | Out-Null
          # Simulate the exact accidental intermediate build on a real user's machine.
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Name StartHotkey -PropertyType DWord -Value 9 -Force | Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Name StopHotkey -PropertyType DWord -Value 20 -Force | Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Name CapsToggleDefaultV3 -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2' -Name TabStartCapsStopDefaultV4 -PropertyType DWord -Value 1 -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class PpcControlsWin32 {
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr GetProp(IntPtr h, string n);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool SetWindowText(IntPtr h, string t);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder b, int n);
              public delegate bool EnumProc(IntPtr h, IntPtr p);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr SendMessageText(IntPtr h, uint m, IntPtr w, StringBuilder l);
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern void keybd_event(byte v, byte s, uint f, UIntPtr x);
              [DllImport("user32.dll")] public static extern short GetKeyState(int v);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);
              public static IntPtr FindMain(uint pid) {
                  IntPtr r=IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) { uint p; GetWindowThreadProcessId(h,out p); if(p==pid && GetDlgItem(h,1001)!=IntPtr.Zero && GetDlgItem(h,1302)!=IntPtr.Zero){r=h;return false;} return true;},IntPtr.Zero);
                  return r;
              }
              public static IntPtr FindDialog(uint pid) {
                  IntPtr r=IntPtr.Zero;
                  EnumWindows(delegate(IntPtr h, IntPtr l) { uint p; GetWindowThreadProcessId(h,out p); if(p!=pid) return true; var b=new StringBuilder(64); GetClassName(h,b,b.Capacity); if(b.ToString()=="#32770"){r=h;return false;} return true;},IntPtr.Zero);
                  return r;
              }
          }
          "@

          function Prop([IntPtr]$h,[string]$n){ return [PpcControlsWin32]::GetProp($h,$n).ToInt64() }
          function Ctrl([IntPtr]$h,[int]$id){ return [PpcControlsWin32]::GetDlgItem($h,$id) }
          function Txt([IntPtr]$h){ $b=New-Object System.Text.StringBuilder 256; [void][PpcControlsWin32]::SendMessageText($h,0x000D,[IntPtr]$b.Capacity,$b); return $b.ToString() }
          function Key([byte]$v){ [PpcControlsWin32]::keybd_event($v,0,0,[UIntPtr]::Zero); Start-Sleep -Milliseconds 90; [PpcControlsWin32]::keybd_event($v,0,2,[UIntPtr]::Zero); Start-Sleep -Milliseconds 180 }
          function ClickParent([IntPtr]$h,[int]$x,[int]$y){ $lp=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcControlsWin32]::SendMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$lp) }
          function PostParent([IntPtr]$h,[int]$x,[int]$y){ $lp=(($y-band 0xffff)-shl 16)-bor($x-band 0xffff); [void][PpcControlsWin32]::PostMessage($h,0x0202,[IntPtr]::Zero,[IntPtr]$lp) }
          function BmClick([IntPtr]$h){ [void][PpcControlsWin32]::SendMessage($h,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero); Start-Sleep -Milliseconds 120 }
          function Checked([IntPtr]$h){ return [PpcControlsWin32]::SendMessage($h,0x00F0,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64() -eq 1 }
          function ComboSet([IntPtr]$h,[int]$idx){ [void][PpcControlsWin32]::SendMessage($h,0x014E,[IntPtr]$idx,[IntPtr]::Zero); Start-Sleep -Milliseconds 80 }
          function ComboGet([IntPtr]$h){ return [PpcControlsWin32]::SendMessage($h,0x0147,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64() }
          function Shot([IntPtr]$h,[string]$name){ $b=New-Object System.Drawing.Bitmap 800,500; $g=[System.Drawing.Graphics]::FromImage($b); $dc=$g.GetHdc(); $ok=[PpcControlsWin32]::PrintWindow($h,$dc,0); $g.ReleaseHdc($dc); $g.Dispose(); if(-not $ok){$b.Dispose();throw 'PrintWindow failed'}; $b.Save((Join-Path (Get-Location) $name),[System.Drawing.Imaging.ImageFormat]::Png); $b.Dispose() }
          function Launch {
              $p=Start-Process -FilePath (Resolve-Path .\PremiumPlusCombo.exe) -PassThru
              $h=[IntPtr]::Zero
              for($i=0;$i-lt 100;$i++){ Start-Sleep -Milliseconds 100; $p.Refresh(); if($p.HasExited){throw "Startup exit $($p.ExitCode)"}; $h=[PpcControlsWin32]::FindMain([uint32]$p.Id); if($h-ne[IntPtr]::Zero){break} }
              if($h-eq[IntPtr]::Zero){throw 'Main window missing'}
              Start-Sleep -Milliseconds 500
              return @($p,$h)
          }
          function DismissDialog([uint32]$pid){
              $d=[IntPtr]::Zero
              for($i=0;$i-lt 50;$i++){ Start-Sleep -Milliseconds 100; $d=[PpcControlsWin32]::FindDialog($pid); if($d-ne[IntPtr]::Zero){break} }
              if($d-eq[IntPtr]::Zero){throw 'Expected save confirmation dialog missing'}
              [void][PpcControlsWin32]::SendMessage($d,0x0111,[IntPtr]1,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 250
          }

          $la=Launch; $p=$la[0]; $h=[IntPtr]$la[1]

          # Bad-build migration must repair and PERSIST the intended CAPS/CAPS toggle.
          if((Txt (Ctrl $h 1301))-ne 'CAPS LOCK' -or (Txt (Ctrl $h 1302))-ne 'CAPS LOCK'){throw 'Accidental TAB/CAPS state was not repaired'}
          $rg=Get-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2'
          if($rg.StartHotkey-ne 20 -or $rg.StopHotkey-ne 20 -or $rg.CapsToggleRestoreV5-ne 1){throw 'V5 repair was not persisted'}
          if((Prop $h 'PPC_ACTIVE')-ne 0){throw 'App did not start inactive'}
          Shot $h 'ui-locked.png'

          # Default physical CAPS LOCK is a start/stop toggle and must not change OS Caps state.
          $caps0=[PpcControlsWin32]::GetKeyState(0x14)-band 1
          Key 0x14
          if((Prop $h 'PPC_ACTIVE')-ne 1){throw 'Default CAPS LOCK failed to start'}
          if(([PpcControlsWin32]::GetKeyState(0x14)-band 1)-ne$caps0){throw 'Start changed Windows Caps state'}
          Key 0x14
          if((Prop $h 'PPC_ACTIVE')-ne 0){throw 'Default CAPS LOCK failed to stop'}
          if(([PpcControlsWin32]::GetKeyState(0x14)-band 1)-ne$caps0){throw 'Stop changed Windows Caps state'}

          # Program all three hotkey buttons exactly as a user does.
          BmClick (Ctrl $h 1301); Key 0x78
          if((Txt (Ctrl $h 1301))-ne 'F9'){throw 'Start hotkey button failed'}
          BmClick (Ctrl $h 1302); Key 0x79
          if((Txt (Ctrl $h 1302))-ne 'F10'){throw 'Stop hotkey button failed'}
          BmClick (Ctrl $h 1204); Key 0x56
          if((Txt (Ctrl $h 1204))-ne 'V'){throw 'Cure hotkey button failed'}

          # Program every editable Rogue setting.
          [void][PpcControlsWin32]::SetWindowText((Ctrl $h 1001),'1')
          [void][PpcControlsWin32]::SetWindowText((Ctrl $h 1002),'2')
          [void][PpcControlsWin32]::SetWindowText((Ctrl $h 1003),'3')
          if(Checked (Ctrl $h 1101)){ BmClick (Ctrl $h 1101) }
          [void][PpcControlsWin32]::SetWindowText((Ctrl $h 1102),'33')
          [void][PpcControlsWin32]::SetWindowText((Ctrl $h 1103),'44')
          if(Checked (Ctrl $h 1201)){ BmClick (Ctrl $h 1201) }
          ComboSet (Ctrl $h 1202) 4
          ComboSet (Ctrl $h 1203) 6

          # Save button: apply controls, persist them, and close its confirmation dialog.
          PostParent $h 400 452
          DismissDialog ([uint32]$p.Id)
          $rg=Get-ItemProperty 'HKCU:\Software\PremiumPlusCombo\RogueV2'
          if($rg.Seq1-ne 49 -or $rg.Seq2-ne 50 -or $rg.Seq3-ne 51){throw 'Sequence controls/save failed'}
          if($rg.REnabled-ne 0 -or $rg.RMax-ne 33 -or $rg.RTurbo-ne 44){throw 'R controls/save failed'}
          if($rg.CureEnabled-ne 0 -or $rg.CureBar-ne 5 -or $rg.CureSlot-ne 7 -or $rg.CureHotkey-ne 86){throw 'Cure controls/save failed'}
          if($rg.StartHotkey-ne 120 -or $rg.StopHotkey-ne 121){throw 'Programmable start/stop save failed'}

          Stop-Process -Id $p.Id -Force
          Start-Sleep -Milliseconds 350
          $la=Launch; $p=$la[0]; $h=[IntPtr]$la[1]

          # Every saved control must reload visibly and functionally.
          if((Txt (Ctrl $h 1001))-ne '1' -or (Txt (Ctrl $h 1002))-ne '2' -or (Txt (Ctrl $h 1003))-ne '3'){throw 'Sequence reload failed'}
          if(Checked (Ctrl $h 1101)){throw 'R checkbox reload failed'}
          if((Txt (Ctrl $h 1102))-ne '33' -or (Txt (Ctrl $h 1103))-ne '44'){throw 'R rate reload failed'}
          if(Checked (Ctrl $h 1201)){throw 'Cure checkbox reload failed'}
          if((ComboGet (Ctrl $h 1202))-ne 4 -or (ComboGet (Ctrl $h 1203))-ne 6){throw 'Cure bar/slot reload failed'}
          if((Txt (Ctrl $h 1204))-ne 'V' -or (Txt (Ctrl $h 1301))-ne 'F9' -or (Txt (Ctrl $h 1302))-ne 'F10'){throw 'Hotkey reload failed'}

          Key 0x78
          if((Prop $h 'PPC_ACTIVE')-ne 1){throw 'Custom F9 start failed'}
          Start-Sleep -Milliseconds 450
          if((Prop $h 'PPC_R_PRESSES')-ne 0){throw 'R emitted while R Combo disabled'}
          if((Prop $h 'PPC_COMBO_BURSTS')-le 0){throw 'Combo engine did not run'}
          Key 0x79
          if((Prop $h 'PPC_ACTIVE')-ne 0){throw 'Custom F10 stop failed'}

          # R checkbox becomes effective through the normal Start button apply path.
          BmClick (Ctrl $h 1101)
          ClickParent $h 307 118
          Start-Sleep -Milliseconds 450
          if((Prop $h 'PPC_ACTIVE')-ne 1 -or (Prop $h 'PPC_R_PRESSES')-le 0){throw 'R Combo checkbox/start path failed'}
          ClickParent $h 492 118
          if((Prop $h 'PPC_ACTIVE')-ne 0){throw 'Drawn Stop button failed'}

          # Cure checkbox + assigned V hotkey + Cure worker.
          BmClick (Ctrl $h 1201)
          ClickParent $h 307 118
          Start-Sleep -Milliseconds 250
          $cure0=Prop $h 'PPC_CURE_RUNS'
          Key 0x56
          Start-Sleep -Milliseconds 350
          if((Prop $h 'PPC_CURE_RUNS')-le$cure0){throw 'Cure enable/hotkey failed'}
          ClickParent $h 492 118

          # Both mode cards are real hit targets.
          ClickParent $h 502 209
          if((Prop $h 'PPC_MODE')-ne 1){throw 'Turbo mode button failed'}
          ClickParent $h 297 209
          if((Prop $h 'PPC_MODE')-ne 0){throw 'Maximum mode button failed'}

          # Master switch disables and restores all setting controls without auto-starting.
          $power=Ctrl $h 1401
          BmClick $power
          if((Prop $h 'PPC_POWER_ENABLED')-ne 0 -or (Prop $h 'PPC_ACTIVE')-ne 0){throw 'Master OFF failed'}
          foreach($id in @(1001,1002,1003,1101,1102,1103,1201,1202,1203,1204,1301,1302)){ if([PpcControlsWin32]::IsWindowEnabled((Ctrl $h $id))){throw "Control $id enabled while OFF"} }
          BmClick $power
          if((Prop $h 'PPC_POWER_ENABLED')-ne 1 -or (Prop $h 'PPC_ACTIVE')-ne 0){throw 'Master ON failed or auto-started'}

          Shot $h 'ui-controls-verified.png'
          "SourceSHA=$((git rev-parse HEAD).Trim())" | Set-Content controls-report.txt
          "MigrationTABCapsToCapsCaps=PASS" | Add-Content controls-report.txt
          "DefaultCapsToggle=PASS" | Add-Content controls-report.txt
          "StartHotkeyButton=PASS" | Add-Content controls-report.txt
          "StopHotkeyButton=PASS" | Add-Content controls-report.txt
          "CureHotkeyButton=PASS" | Add-Content controls-report.txt
          "SequenceControls=PASS" | Add-Content controls-report.txt
          "RControls=PASS" | Add-Content controls-report.txt
          "CureControls=PASS" | Add-Content controls-report.txt
          "SaveAndReload=PASS" | Add-Content controls-report.txt
          "CustomF9F10Runtime=PASS" | Add-Content controls-report.txt
          "RComboRuntime=PASS" | Add-Content controls-report.txt
          "CureRuntime=PASS" | Add-Content controls-report.txt
          "ModeButtons=PASS" | Add-Content controls-report.txt
          "MasterPower=PASS" | Add-Content controls-report.txt
          "AllInteractiveControls=PASS" | Add-Content controls-report.txt
          $hash=(Get-FileHash PremiumPlusCombo.exe -Algorithm SHA256).Hash
          "SHA256=$hash" | Add-Content controls-report.txt
          Stop-Process -Id $p.Id -Force

      - name: Check static portable dependencies
        shell: pwsh
        run: |
          cd tools/premium-plus-combo
          $deps=(dumpbin /DEPENDENTS PremiumPlusCombo.exe | Out-String)
          $deps | Set-Content controls-dependencies.txt
          if($deps -match 'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt'){throw 'External VC runtime dependency detected'}
          'StaticCRT=PASS' | Add-Content controls-report.txt

      - name: Upload fully tested controls build
        uses: actions/upload-artifact@v4
        with:
          name: PremiumPlusCombo-All-Controls-Verified
          path: |
            tools/premium-plus-combo/PremiumPlusCombo.exe
            tools/premium-plus-combo/controls-report.txt
            tools/premium-plus-combo/controls-dependencies.txt
            tools/premium-plus-combo/ui-locked.png
            tools/premium-plus-combo/ui-controls-verified.png
          if-no-files-found: error
